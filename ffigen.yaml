# ffigen — generate the raw C-ABI bindings from the published corvid.h.
#
# The input header is the RELEASE's corvid.h, fetched and verified by
# fetch.sh / fetch.ps1 into deps/current/ (never vendored in git; deps/ is
# gitignored). The OUTPUT, lib/src/bindings.dart, IS committed so consumers
# and CI never need libclang — and it is DRIFT-GATED: the CI "ffigen drift"
# job re-runs this config against the freshly fetched header and fails when
# the committed file differs (so an engine pin bump cannot change the ABI
# surface silently).
#
# Regenerate locally with:   ./fetch.sh && dart run ffigen
name: CorvidNative
description: >-
  Raw bindings for the corvid C ABI (generated by ffigen from the pinned
  release's corvid.h — do not edit by hand; regenerate with dart run ffigen).
output: lib/src/bindings.dart
sort: true
headers:
  entry-points:
    - deps/current/corvid.h
  # Only declarations originating from corvid.h itself are bound — the
  # system headers it includes (stdarg/stdbool/stddef/stdint/stdlib)
  # contribute nothing but platform-dependent strays (darwin signal
  # types vs glibc's), and the ABI's fixed-size integer types map to
  # dart:ffi builtins anyway. This keeps the generated file HOST-
  # STABLE, which the CI drift gate (regenerate + byte-diff) depends on.
  include-directives:
    - '**corvid.h'
functions:
  include:
    - corvid_.*
  symbol-address:
    # The destructors the NativeFinalizer backstops need (docs/PLAN.md's
    # lifetime table) plus the ABI/version probes.
    include:
      - corvid_ffi_version
      - corvid_last_error_code
      - corvid_last_error_message
      - corvid_close
      - corvid_collection_free
      - corvid_query_free
      - corvid_pred_free
      - corvid_free
enums:
  include:
    - corvid_.*
  # All seven corvid enums are FROZEN wire contracts (FFI.md: values are
  # pinned under FFI_VERSION = 1), and this binding's wrapper plumbing is
  # int-typed end to end — v0.3.0's C23-guarded header presented them to
  # libclang as uint32 typedefs, so ffigen generated ints and the wrapper
  # was built on that. v0.3.1's plain `typedef enum` would flip ffigen to
  # full Dart enums (corvid_status.fromValue + ArgumentError on unknown
  # values) — a public-surface churn with zero wire change. Pin the
  # generated shape to ints here; a deliberate typed-enum upgrade is a
  # separate decision, not a pin-bump side effect.
  as-int:
    include:
      - corvid_status
      - corvid_metric
      - corvid_quant
      - corvid_field_type
      - corvid_err
      - corvid_cmp
      - corvid_value_type_t
globals:
  include:
    - corvid_.*
unnamed-enums:
  include:
    - corvid_.*
structs:
  include:
    - corvid_.*
  exclude:
    # System-header strays that ride in as dependencies of the stddef/
    # stdint includes — never referenced by a corvid symbol.
    - __.*
    - sigval
    - wait
typedefs:
  include:
    - corvid_.*
# The engine is compiled without dart-specific ABI expectations; keep the
# default packing and pointer sizes (host ABI).
preamble: |
  // AUTO-GENERED FILE — DO NOT EDIT (dart run ffigen, ffigen.yaml).
  //
  // Raw bindings for the corvid C ABI (corvid.h) at the pinned engine tag
  // (deps/current/corvid.h, fetched + sha256-verified by fetch.sh). The
  // committed file is drift-gated in CI: regenerating with the same header
  // and ffigen must reproduce it byte-for-byte. This is an internal layer —
  // nothing here is exported by package:corvid_dart/corvid.dart (the ABI
  // never leaks into the binding's public API, FFI.md ruling 3).
